behaviour:
  insufficient_scope: A tool call that needs a scope the connection does not have returns insufficient_scope; the fix is to disconnect (Dashboard > Account > Connected apps) and reconnect granting both permissions.
  api_key_equivalence: An API key (sk_live_) is not scoped — it carries the whole owner's surface; the agent card's securityRequirements nonetheless list both scope names under bearer as well as oauth2.
  granularity_gap: Two scopes cover a 20-tool / 115-operation surface; there is no per-resource or read-only-billing scope, and no scope distinguishes the paid writes (fill, fax) from the free ones (delete, attach).
