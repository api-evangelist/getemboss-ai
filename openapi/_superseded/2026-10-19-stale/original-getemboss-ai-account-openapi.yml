  /utilities/{skill}:
    post:
      summary: Run a free PDF utility
      description: 'POST /utilities/{skill}: run one of the free PDF utilities (compose_pdf,

        merge_pdf, extract_pages, delete_pages, reorder_pages, rotate_pages,

        inspect_pdf) synchronously against prior artifacts, returning the result

        inline. Account callers authenticate with a Bearer key; anonymous callers

        send no credential and a valid artifact_token on every source.'
      operationId: run_utility_utilities__skill__post
      parameters:
      - name: skill
        in: path
        required: true
        schema:
          type: string
          title: Skill
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: compose_pdf and merge_pdf take sources; extract_pages, delete_pages, rotate_pages, reorder_pages, and inspect_pdf take a single artifact_id (plus pages for extract_pages/delete_pages, order for reorder_pages, or rotations for rotate_pages).
              properties:
                sources:
                  type: array
                  maxItems: 20
                  description: 'For compose_pdf and merge_pdf: a list of prior artifacts, combined into one PDF (merge_pdf takes whole files: no pages or rotate).'
                  items:
                    type: object
                    properties:
                      artifact_id:
                        type: string
                        description: A prior artifact's id.
                      artifact_token:
                        type: string
                        description: The capability token for an anonymous artifact_id.
                      pages:
                        type: string
                        description: An optional page range, such as 1-3,7.
                      rotate:
                        type: integer
                        enum:
                        - 90
                        - 180
                        - 270
                        description: An optional rotation, in degrees.
                    required:
                    - artifact_id
                artifact_id:
                  type: string
                  description: 'For the single-source skills (extract_pages, delete_pages, reorder_pages, rotate_pages, inspect_pdf): the artifact to operate on.'
                artifact_token:
                  type: string
                  description: 'For pay-per-call callers, alongside artifact_id: the capability token for an anonymous artifact_id.'
                pages:
                  type: string
                  description: A selection like 1-3,7 (1-based); required by extract_pages and delete_pages.
                order:
                  type: array
                  items:
                    type: integer
                  description: 'reorder_pages: every page number exactly once.'
                rotations:
                  type: array
                  description: 'rotate_pages: a list of page-range/degree pairs.'
                  items:
                    type: object
                    properties:
                      pages:
                        type: string
                        description: A selection like 1-3,7.
                      degrees:
                        type: integer
                        enum:
                        - 90
                        - 180
                        - 270
