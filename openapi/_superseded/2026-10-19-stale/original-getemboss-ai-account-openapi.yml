  /fax:
    post:
      summary: Send Fax
      description: 'POST /fax: multipart (`to` + one or more PDF `files`, sent as one fax) or

        JSON ({"to", then exactly one of "job_id", "form_id", "pdf_url",

        "pdf_base64"}). JSON references resolve to the owner''s stored PDF through

        service/fax_source.py; multipart bytes go straight to the fax service.


        Honours Idempotency-Key (plan 2 task 5): a client-side retry with the same

        key replays the original job''s response instead of submitting a second

        fax. Independent of (and in addition to) create_fax_job''s own artifact+

        destination dedupe window, which catches a retry that used a fresh

        Idempotency-Key or none at all.'
      operationId: send_fax_fax_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                to:
                  type: string
                  description: Destination fax number, in E.164 form.
                files:
                  items:
