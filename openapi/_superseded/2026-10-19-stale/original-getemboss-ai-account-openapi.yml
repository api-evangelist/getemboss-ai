  /forms/{form_id}/fill-batch:
    post:
      summary: Fill Batch
      description: 'on_row: optional async (batch_id, row_number, total, result_dict) callback,

        threaded straight into _run_batch (see its own docstring). None for every

        FastAPI-routed call (REST''s own request body has no such field -- this is a

        plain extra kwarg, not a Form()/Body() field, so it is never bound from the

        wire); the A2A executor is the only caller that passes one, by calling this

        function directly as a Python coroutine rather than through routing.


        `retention`: the form already exists, so this is accepted for symmetry

        with the other routes and validated, but otherwise ignored: the form''s

        own policy (set at creation) is what governs it. Checked with

        isinstance(str), not `is not None`: fill_batch is also called directly as

        a plain coroutine (quotes.py''s execute_quote resume, accounts.py''s

        admin_fill_batch), bypassing FastAPI''s own request parsing -- there, an

        omitted `retention` kwarg leaves the parameter at its literal default,

        the Form(None) marker object itself, not None (mirrors why `on_row`

        above uses a plain None default rather than a Form marker).'
      operationId: fill_batch_forms__form_id__fill_batch_post
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      - name: on_row
        in: query
        required: false
        schema:
          title: On Row
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_fill_batch_forms__form_id__fill_batch_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
