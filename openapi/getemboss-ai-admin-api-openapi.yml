                $ref: '#/components/schemas/PaymentMethodResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/billing/run-invoicing:
    post:
      summary: Admin Run Invoicing
      description: 'Admin-gated monthly billing run. Idempotent (billing_runs claim) + safe by default

        (preview unless BILLING_ENABLED and not dry_run). Per-owner isolation: one owner''s error

        becomes {status:''error''} and the batch continues.'
      operationId: admin_run_invoicing_admin_billing_run_invoicing_post
      parameters:
      - name: period
        in: query
        required: true
        schema:
          type: string
          title: Period
      - name: owner
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Dry Run
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/nudges/run:
    post:
      summary: Admin Run Nudges
      description: 'Admin-gated hourly nudge run. Idempotent per (owner, kind) via nudges_sent; dry_run

        lists who would be emailed and claims nothing. Also doubles as the nightly maintenance

        tick: purges expired OAuth rows (download links, codes, stale pending grants),

        terminal a2a_tasks rows older than 30 days (the A2A server''s own retention policy,

        service/a2a_store.py''s purge_expired), expired x402 quotes plus their staged

        R2 objects (service/quotes.py''s purge_expired_quotes), and ownerless proposals

        that expired before their caller ever committed (service/commits.py''s

        auto_commit_expired, so a paid anonymous prepare still ends in a file under

        its named policy) before the nudge pass runs, each step best-effort so one

        purge failure never blocks the others or nudges.'
      operationId: admin_run_nudges_admin_nudges_run_post
      parameters:
      - name: owner
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Dry Run
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/retention/sweep:
    post:
      summary: Admin Retention Sweep
      description: 'Admin-gated maintenance tick (spec 2.5 retention; send_fax spec section 9):

        called every ten minutes by the emboss-retention-cron Railway service. Runs the

        ephemeral-retention sweep, then the fax timeout sweep and the fax artifact

        reaper, each fail-soft. dry_run lists what is due and touches nothing.'
      operationId: admin_retention_sweep_admin_retention_sweep_post
      parameters:
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Dry Run
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/library/{slug}/store:
    post:
      summary: Admin Library Store
      description: 'Store one fetched copy. Called by scripts/seed_library.py, which does the

        fetching: this process never reaches a government site, so the network

        policy for the seed lives in one script rather than in the service.


        `page_count` is ACCEPTED AND IGNORED. The seed script still sends it, so

        dropping the field would 422 a caller that is otherwise correct, but the

        route parses the bytes itself and stores what it read. The only two facts

        the caller supplies that this route trusts are the slug and the revision

        label, and the revision is a label for a person, never a decision input.'
      operationId: admin_library_store_admin_library__slug__store_post
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_admin_library_store_admin_library__slug__store_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/library/check:
    post:
      summary: Admin Library Check
      description: 'The weekly freshness check. Re-fetches every catalogue URL, compares the

        hash with the active row, writes one library_checks row each, and changes

        NOTHING that is served.'
      operationId: admin_library_check_admin_library_check_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Admin
  /admin/library:
    get:
      summary: Admin Library
      description: 'Every catalogue form with its active revision and last check status. A

        slug that has never been seeded shows a null revision, which is the readout

        that says a seed run is owed.'
      operationId: admin_library_admin_library_get
      responses:
