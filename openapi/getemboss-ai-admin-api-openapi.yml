openapi: 3.2.0
info:
  title: Getemboss Ai Admin API
  version: 0.1.0
  description: 'Operations tagged Admin across 2 of this provider''s published API definitions: getemboss-ai-account-openapi.json, getemboss-ai-account-openapi.yml. Each path carries the servers of the definition it was published in.'
security:
- bearer: []
- oauth2:
  - forms:read
  - forms:write
tags:
- name: Admin
paths:
  /admin/account:
    get:
      summary: Admin Get Account
      description: 'The account page''s own row: who this owner is, and the retention default

        every form they create afterwards inherits (spec section 3). Admin-gated with

        an owner param, like every other route on this router; the dashboard reads its

        signed-in user''s owner here.'
      operationId: admin_get_account_admin_account_get
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
    patch:
      summary: Admin Patch Account
      description: 'Flip the account default. Affects forms created afterwards only: an

        existing form keeps the policy it was created with.'
      operationId: admin_patch_account_admin_account_patch
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/usage:
    get:
      summary: Admin Usage
      description: 'Admin-only: usage for an arbitrary owner (the dashboard reads its logged-in

        user''s owner here). Whole router is behind require_admin. Mirrors the product

        GET /usage shape, but takes owner as a query param instead of the api-key state.'
      operationId: admin_usage_admin_usage_get
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/usage/detail:
    get:
      summary: Admin Usage Detail
      operationId: admin_usage_detail_admin_usage_detail_get
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      - name: month
        in: query
        required: true
        schema:
          type: string
          title: Month
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/billing/breakdown:
    get:
      summary: Admin Billing Breakdown
      operationId: admin_billing_breakdown_admin_billing_breakdown_get
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      - name: month
        in: query
        required: true
        schema:
          type: string
          title: Month
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingBreakdownResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/forms:
    get:
      summary: Admin Forms
      operationId: admin_forms_admin_forms_get
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 12
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormsListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
    post:
      summary: Admin Create Form
      description: 'Admin act-as-owner create-fillable-form (the batch-fill web page). Delegates to

        the owner-scoped forms.create_form, which reads request.state.owner for billing +

        ownership.'
      operationId: admin_create_form_admin_forms_post
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_admin_create_form_admin_forms_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/forms/batch-runs:
    get:
      summary: Admin Batch Runs
      operationId: admin_batch_runs_admin_forms_batch_runs_get
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRunsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/forms/batch-counts:
    get:
      summary: Admin Batch Counts
      operationId: admin_batch_counts_admin_forms_batch_counts_get
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCountsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/layouts:
    get:
      summary: Admin Layouts
      description: 'The reuse readout for shared form_layouts rows: kind, hits, page count,

        match_baseline, title and timestamps. The table carries no owner or form

        id, so there is nothing here to scope or leak. match_baseline is the

        per-row loose bar (spec 1.4): an operator reading a row with many

        loose_hits and a low baseline is looking at the one shape of row worth

        checking by hand.'
      operationId: admin_layouts_admin_layouts_get
      parameters:
      - name: top
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Top
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/forms/{form_id}:
    delete:
      summary: Admin Delete Form
      operationId: admin_delete_form_admin_forms__form_id__delete
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
    get:
      summary: Admin Form Status
      description: 'Admin act-as-owner form status poll. Delegates to owner-scoped forms.get_form

        (which owner-scopes via request.state.owner / owned_or_404).'
      operationId: admin_form_status_admin_forms__form_id__get
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/forms/{form_id}/thumbnail:
    get:
      summary: Admin Form Thumbnail
      operationId: admin_form_thumbnail_admin_forms__form_id__thumbnail_get
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          title: Form Id
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/usage/trend:
    get:
      summary: Admin Usage Trend
      operationId: admin_usage_trend_admin_usage_trend_get
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      - name: days
        in: query
        required: false
        schema:
          type: integer
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageTrendResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/usage/events:
    get:
      summary: Admin Usage Events
      operationId: admin_usage_events_admin_usage_events_get
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      - name: range
        in: query
        required: false
        schema:
          type: string
          default: 24h
          title: Range
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Page Size
      - name: kinds
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Kinds
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/forms/with-context:
    post:
      summary: Admin Create With Context
      description: 'Admin act-as-owner context fill (the /fill web page). Runs the owner''s

        billing gate; meters one with_context event for that owner.'
      operationId: admin_create_with_context_admin_forms_with_context_post
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_admin_create_with_context_admin_forms_with_context_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextJobCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/forms/with-context/{job_id}:
    get:
      summary: Admin Context Status
      operationId: admin_context_status_admin_forms_with_context__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextJobStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/forms/with-context/{job_id}/render:
    post:
      summary: Admin Context Render
      operationId: admin_context_render_admin_forms_with_context__job_id__render_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/forms/with-context/{job_id}/pdf:
    get:
      summary: Admin Context Pdf
      operationId: admin_context_pdf_admin_forms_with_context__job_id__pdf_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/forms/{form_id}/with-context:
    post:
      summary: Admin Fill Existing
      description: 'Admin act-as-owner standalone fill: fill an existing ready form owned by

        `owner` from context. Bills one with_context event.'
      operationId: admin_fill_existing_admin_forms__form_id__with_context_post
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_admin_fill_existing_admin_forms__form_id__with_context_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextJobCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/web-token/limits:
    get:
      summary: Admin Web Token Limits
      description: The engine's upload limits, so the website never hardcodes a number.
      operationId: admin_web_token_limits_admin_web_token_limits_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebTokenLimitsResponse'
      tags:
      - Admin
  /admin/web-token:
    post:
      summary: Admin Mint Web Token
      description: 'Mint a 15-minute, refresh-less web token so the signed-in browser can

        upload straight to the owner routes (spec 2026-09-09-web-direct-upload).

        The plaintext is returned once and never logged.'
      operationId: admin_mint_web_token_admin_web_token_post
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/forms/{form_id}/suggest-mapping:
    post:
      summary: Admin Suggest Mapping
      description: 'Admin act-as-owner spreadsheet->field mapping suggestion (the batch-fill web

        page). Delegates to the owner-scoped batch.suggest_mapping_endpoint, which reads

        request.state.owner for owner-scoping + with_context metering. admin_acting skips

        the anti-abuse rate limit; billing still applies. This 2-segment route cannot be

        shadowed by the 1-segment /admin/forms/{form_id} above.'
      operationId: admin_suggest_mapping_admin_forms__form_id__suggest_mapping_post
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_admin_suggest_mapping_admin_forms__form_id__suggest_mapping_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingSuggestion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/forms/{form_id}/fill-batch:
    post:
      summary: Admin Fill Batch
      description: 'Admin act-as-owner batch fill (the batch-fill web page). Delegates to the

        owner-scoped batch.fill_batch, which reads request.state.owner for owner-scoping

        (owned_or_404), billing (standard_fill per row), and per-row metering. admin_acting

        skips the anti-abuse rate limit; billing still applies. This 2-segment route cannot

        be shadowed by the 1-segment /admin/forms/{form_id} above.'
      operationId: admin_fill_batch_admin_forms__form_id__fill_batch_post
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_admin_fill_batch_admin_forms__form_id__fill_batch_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/forms/fill-batch/{batch_id}:
    get:
      summary: Admin Batch Status
      description: 'Admin act-as-owner batch-fill status poll (the batch-fill web page). Delegates

        to the owner-scoped batch.batch_status, which owner-scopes via request.state.owner

        (owned_or_404). `fill-batch` is a static segment so this cannot be shadowed by the

        1-segment /admin/forms/{form_id} route above. No rate limit/billing on this GET;

        admin_acting set for uniformity with the other admin act-as-owner routes.'
      operationId: admin_batch_status_admin_forms_fill_batch__batch_id__get
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Batch Id
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/forms/fill-batch/{batch_id}/zip:
    get:
      summary: Admin Batch Zip
      description: 'Admin act-as-owner batch-fill zip download (the batch-fill web page). Delegates

        to the owner-scoped batch.batch_zip, which owner-scopes via request.state.owner

        (owned_or_404). `fill-batch` is a static segment so this cannot be shadowed by the

        1-segment /admin/forms/{form_id} route above. No rate limit/billing on this GET;

        admin_acting set for uniformity with the other admin act-as-owner routes.'
      operationId: admin_batch_zip_admin_forms_fill_batch__batch_id__zip_get
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Batch Id
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/billing/setup-intent:
    post:
      summary: Admin Billing Setup Intent
      operationId: admin_billing_setup_intent_admin_billing_setup_intent_post
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupIntentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/billing/payment-method:
    get:
      summary: Admin Billing Payment Method
      operationId: admin_billing_payment_method_admin_billing_payment_method_get
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/billing/invoices:
    get:
      summary: Admin Billing Invoices
      operationId: admin_billing_invoices_admin_billing_invoices_get
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/billing/confirm:
    post:
      summary: Admin Billing Confirm
      operationId: admin_billing_confirm_admin_billing_confirm_post
      parameters:
      - name: owner
        in: query
        required: true
        schema:
          type: string
