              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Admin
  /admin/library/{slug}/accept:
    post:
      summary: Admin Library Accept
      description: 'Accept a changed form: fetch again, store the new copy, make it active,

        run make-fillable on it, and keep the old row inactive rather than deleting

        it, so a form filed against the previous revision can still be explained.'
      operationId: admin_library_accept_admin_library__slug__accept_post
      parameters:
