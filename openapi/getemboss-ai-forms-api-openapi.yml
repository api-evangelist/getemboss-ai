        - forms:write
  /forms/prepare:
    post:
      summary: Prepare New
      description: 'Extract a fresh PDF and prepare it in one call: create + with_context.'
      operationId: prepare_new_forms_prepare_post
      requestBody:
        content:
          multipart/form-data:
            schema:
