  /pay/make-fillable:
    post:
      operationId: pay_make_fillable
      summary: Turn a flat or scanned PDF form into a fillable PDF with detected fields
      description: 'Turn a flat or scanned PDF form into a fillable PDF with detected fields. Also: detect form fields in a PDF; add fillable fields to a document; extract a PDF form schema; make a government or business form fillable; XFA forms; Adobe LiveCycle forms; Adobe dynamic forms. Input: a PDF file. Ephemeral processing: source and output documents are deleted 60 to 70 minutes after the last activity on a form.'
      tags:
      - Forms
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pdf_url:
                  type: string
                  format: uri
                  description: Public https URL of the PDF form; Emboss downloads it (10 MB limit).
                pdf_base64:
                  type: string
                  contentEncoding: base64
                  description: The PDF form as standard base64 (10 MB decoded limit).
              oneOf:
              - required:
                - pdf_url
              - required:
                - pdf_base64
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF form.
              required:
              - file
      responses:
        '402':
          description: Payment Required
        '202':
          description: Paid and accepted. The Payment-Receipt header carries the MPP receipt. Poll status_url for the result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status_url:
                    type: string
                    format: uri
                  quote_id:
                    type: string
                  artifact_id:
                    type: string
                    description: The result artifact's id, when the op produced one.
                  artifact_token:
                    type: string
                    description: Bearer token for artifact_id (anonymous callers only).
                  artifacts:
                    type: array
                    items:
                      type: object
                    description: 'Every artifact the op produced: [{artifact_id, role, mime_type}].'
                required:
                - job_id
                - status_url
                - quote_id
        '400':
          description: Not a readable PDF, or a required input is missing.
        '413':
          description: Too many pages or too much context.
      x-payment-info:
        price:
          mode: dynamic
          currency: USD
          amount: '0.05'
          min: '0.05'
          max: '1.00'
        protocols:
        - mpp:
            method: tempo
            intent: charge
            currency: '0x20c000000000000000000000b9537d11c60e8b50'
        - mpp:
            method: stripe
            intent: charge
            currency: usd
        - x402:
            scheme: exact
            network: eip155:8453
            asset: '0x833589fCD6eDb6E08f4c7C32D4f71b54bda02913'
        - x402:
            scheme: exact
            network: eip155:1
            asset: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'
            facilitator: circle-gateway
        - x402:
            scheme: exact
            network: eip155:8453
            asset: '0x833589fcd6edb6e08f4c7c32d4f71b54bda02913'
            facilitator: circle-gateway
        - x402:
            scheme: exact
            network: eip155:43114
            asset: '0xb97ef9ef8734c71904d8002f8b6bc66dd9c48a6e'
            facilitator: circle-gateway
        - x402:
            scheme: exact
            network: eip155:42161
            asset: '0xaf88d065e77c8cc2239327c5edb3a432268e5831'
            facilitator: circle-gateway
        - x402:
            scheme: exact
            network: eip155:10
            asset: '0x0b2c639c533813f4aa9d7837caf62653d097ff85'
            facilitator: circle-gateway
        - x402:
            scheme: exact
            network: eip155:137
            asset: '0x3c499c542cef5e3811e1192ce70d8cc03d5c3359'
            facilitator: circle-gateway
        - x402:
            scheme: exact
            network: eip155:130
            asset: '0x078d782b760474a361dda0af3839290b0ef57ad6'
            facilitator: circle-gateway
        - x402:
            scheme: exact
            network: eip155:146
            asset: '0x29219dd400f2bf60e5a23d13be72b486d4038894'
            facilitator: circle-gateway
        - x402:
            scheme: exact
            network: eip155:480
            asset: '0x79a02482a880bce3f13e09da970dc34db4cd24d1'
            facilitator: circle-gateway
        - x402:
            scheme: exact
            network: eip155:1329
            asset: '0xe15fc38f6d8c56af07bbcbe3baf5708a2bf42392'
            facilitator: circle-gateway
        - x402:
            scheme: exact
            network: eip155:999
            asset: '0xb88339cb7199b77e23db6e890353e22632ba630f'
            facilitator: circle-gateway
        - x402:
            scheme: exact
            network: eip155:5042
            asset: '0x3600000000000000000000000000000000000000'
            facilitator: circle-gateway
        amount: '50000'
        unitType: request
        description: 'Turn a flat or scanned PDF form into a fillable PDF with detected fields. Input: a PDF file.'
        priceNote: Price scales with page count between min and max; the exact amount for your request is in the 402 challenge.
    servers:
    - url: https://api.getemboss.ai
  /pay/fill-with-context:
    post:
      operationId: pay_fill_with_context
      summary: Fill a PDF form using facts found in supporting documents
      description: 'Fill a PDF form using facts found in supporting documents. Also: fill a PDF form from DOCX, spreadsheets, images, JSON, or other documents; pre-fill a government form from supporting paperwork; complete an application from a resume or company details; extract answers from context documents into a form. Input: a PDF file plus one or more context files and/or context_text/context_urls. Ephemeral processing: source and output documents are deleted 60 to 70 minutes after the last activity on a form.'
      tags:
      - Forms
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pdf_url:
                  type: string
                  format: uri
                  description: Public https URL of the PDF form; Emboss downloads it (10 MB limit).
                pdf_base64:
                  type: string
                  contentEncoding: base64
                  description: The PDF form as standard base64 (10 MB decoded limit).
                context_base64:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required:
                    - name
                    - base64
                    properties:
                      name:
                        type: string
                        description: Filename, used to tell documents apart.
                      base64:
                        type: string
                        contentEncoding: base64
                        description: The document as standard base64.
                  description: Up to 5 supporting documents (PDF, text, images) as base64.
                context_text:
                  type: string
                  maxLength: 200000
                  description: Supporting text, up to 200,000 characters.
                context_urls:
                  type: array
                  items:
                    type: string
                    format: uri
                  maxItems: 5
                  description: Up to 5 public https URLs of supporting documents.
                policy:
                  type: string
                  enum:
                  - safe
                  - strict
                  description: 'How sure Emboss must be before writing a value: safe (default) writes high and medium confidence, strict writes high only.'
                mode:
                  type: string
                  enum:
                  - one_call
                  - two_call
                  description: one_call (default) returns the finished PDF; two_call returns a proposal and a commit token so the caller can resolve open items before anything is written.
                package:
                  type: boolean
                  description: 'mode=two_call only: also produce one submission package at commit, holding the filled form, the attachments uploaded against the proposal, and the receipt. Priced into this quote.'
              oneOf:
              - required:
                - pdf_url
              - required:
                - pdf_base64
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF form.
                context:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Supporting documents (PDF, text, images).
                context_text:
                  type: string
                  maxLength: 200000
                  description: Supporting text, up to 200,000 characters.
                context_urls:
                  type: array
                  items:
                    type: string
                    format: uri
                  maxItems: 5
                  description: Up to 5 public https URLs of supporting documents.
                policy:
                  type: string
                  enum:
                  - safe
                  - strict
                  description: 'How sure Emboss must be before writing a value: safe (default) writes high and medium confidence, strict writes high only.'
                mode:
                  type: string
                  enum:
                  - one_call
                  - two_call
                  description: one_call (default) returns the finished PDF; two_call returns a proposal and a commit token so the caller can resolve open items before anything is written.
                package:
                  type: boolean
                  description: 'mode=two_call only: also produce one submission package at commit, holding the filled form, the attachments uploaded against the proposal, and the receipt. Priced into this quote.'
              required:
              - file
      responses:
        '402':
          description: Payment Required
        '202':
          description: Paid and accepted. The Payment-Receipt header carries the MPP receipt. Poll status_url for the result. With mode=two_call the body also carries proposal_id, commit_token and proposal_url.
