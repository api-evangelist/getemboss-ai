        amount: '30000'
        unitType: request
        description: 'Send a PDF to a fax number and track delivery, priced per transmitted page. Input: a PDF file and a destination fax number in E.164 form. Card payments have a 0.50 minimum, stablecoins pay the exact price.'
        priceNote: Price scales with page count between min and max; the exact amount for your request is in the 402 challenge.
    servers:
    - url: https://api.getemboss.ai
  /pay/quote:
    post:
      operationId: pay_quote
      summary: Free price check for a PDF
      description: 'Free and stateless: returns the page count, whether the PDF already has form fields, and the exact price of every operation for this PDF. Call it before paying.'
      tags:
      - Forms
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pdf_url:
                  type: string
                  format: uri
                  description: Public https URL of the PDF form; Emboss downloads it (10 MB limit).
                pdf_base64:
                  type: string
                  contentEncoding: base64
                  description: The PDF form as standard base64 (10 MB decoded limit).
                context_base64:
                  type: array
                  maxItems: 5
                  items:
                    type: object
                    required:
                    - name
                    - base64
                    properties:
                      name:
                        type: string
                        description: Filename, used to tell documents apart.
                      base64:
                        type: string
                        contentEncoding: base64
                        description: The document as standard base64.
                  description: Up to 5 supporting documents (PDF, text, images) as base64.
                context_text:
                  type: string
                  maxLength: 200000
                  description: Supporting text, up to 200,000 characters.
                context_urls:
                  type: array
                  items:
                    type: string
                    format: uri
                  maxItems: 5
                  description: Up to 5 public https URLs of supporting documents.
                policy:
                  type: string
                  enum:
                  - safe
                  - strict
                  description: 'How sure Emboss must be before writing a value: safe (default) writes high and medium confidence, strict writes high only.'
                mode:
                  type: string
                  enum:
                  - one_call
                  - two_call
                  description: one_call (default) returns the finished PDF; two_call returns a proposal and a commit token so the caller can resolve open items before anything is written.
              oneOf:
              - required:
                - pdf_url
              - required:
                - pdf_base64
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF form.
                context:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Supporting documents (PDF, text, images).
                context_text:
                  type: string
                  maxLength: 200000
                  description: Supporting text, up to 200,000 characters.
                context_urls:
                  type: array
                  items:
                    type: string
                    format: uri
                  maxItems: 5
                  description: Up to 5 public https URLs of supporting documents.
                policy:
                  type: string
                  enum:
                  - safe
                  - strict
                  description: 'How sure Emboss must be before writing a value: safe (default) writes high and medium confidence, strict writes high only.'
                mode:
                  type: string
                  enum:
                  - one_call
                  - two_call
                  description: one_call (default) returns the finished PDF; two_call returns a proposal and a commit token so the caller can resolve open items before anything is written.
              required:
              - file
      responses:
        '200':
          description: Free price check for this PDF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pages:
                    type: integer
                  already_fillable:
                    type: boolean
                  context_pages:
                    type: integer
                  prices:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        cents:
                          type: integer
                        usd:
                          type: string
                        atomic:
                          type: string
                  methods:
                    type: array
                    items:
                      type: string
                  card_minimum_usd:
                    type: string
                  next:
                    type: string
                required:
                - pages
                - already_fillable
                - context_pages
                - prices
                - methods
                - card_minimum_usd
                - next
        '400':
          description: Not a readable PDF, or a required input is missing.
        '413':
          description: Too many pages or too much context.
        '429':
          description: Too many quote requests from this client.
    servers:
    - url: https://api.getemboss.ai
