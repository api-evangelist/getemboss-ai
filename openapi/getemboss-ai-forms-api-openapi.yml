      - oauth2:
        - forms:read
        - forms:write
  /forms/{form_id}/prepare:
    post:
      summary: Prepare Existing
      description: 'Prepare an already-extracted form the caller owns: one with_context event,

        a proposal instead of a rendered PDF. The form already exists, so `retention`

        is accepted for symmetry and validated, but otherwise ignored: the form''s own

        policy (set at creation) is what governs it.'
      operationId: prepare_existing_forms__form_id__prepare_post
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      requestBody:
