      security:
      - bearer: []
      - oauth2:
        - forms:read
        - forms:write
  /forms/{form_id}/suggest-mapping:
    post:
      summary: Suggest Mapping Endpoint
      operationId: suggest_mapping_endpoint_forms__form_id__suggest_mapping_post
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_suggest_mapping_endpoint_forms__form_id__suggest_mapping_post'
      responses:
        '200':
          description: Successful Response
          content:
