        - forms:write
  /forms/{form_id}/verify:
    post:
      summary: Verify Filled Pdf
      description: 'Verify a filled PDF the caller already holds against this form''s contract.


        Standalone because the caller may have rendered elsewhere, or filled by hand,

        and still wants the machine-readable answer to "is this document done". No

        model call: the same extraction.verify.check a commit runs, on a state read

        back out of the uploaded document.


        This router carries no require_owner dependency (commit authorises itself, so

        it must accept proposal tokens), so this route calls require_owner directly.

        Verify is owner-only: there is no proposal here to bear a token.


        request.state.owner already set is treated as pre-authorised, same as

        _authorise above: MCP''s owner_request and A2A''s _fake_request splice a

        resolved owner onto a request-shaped object before calling this route

        function directly and carry no real bearer credentials of their own for

        require_owner to read.'
      operationId: verify_filled_pdf_forms__form_id__verify_post
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_verify_filled_pdf_forms__form_id__verify_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Forms
      security:
      - bearer: []
      - oauth2:
        - forms:read
        - forms:write
  /forms/{form_id}/preview-fill:
    post:
      summary: Preview Fill
      operationId: preview_fill_forms__form_id__preview_fill_post
      parameters:
