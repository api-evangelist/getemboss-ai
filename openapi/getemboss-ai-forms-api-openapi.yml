openapi: 3.2.0
info:
  title: Emboss Forms API
  summary: Turn a flat PDF into a fillable form, fill it, check it, and send it.
  description: 'Emboss is a PDF form-filling API for developers and agents. Hand it a flat or scanned PDF and it detects the fields and returns a fillable form. Fill that form from structured values or from the documents that hold the answers, and Emboss proposes every answer with its source, says what is missing, and returns the finished PDF with a receipt. It also reads a filled form back into labelled values, fills one copy per spreadsheet row, packages a form with its attachments, and faxes the result. Pricing is per job in cents with a monthly free allowance.


    The same engine answers on four interfaces: this REST API, a remote MCP server at /mcp, an A2A agent at /a2a, and an anonymous pay-per-call API at /pay whose own manifest is served at the origin root /openapi.json.


    Documents are deleted 60 to 70 minutes after the last activity on a form under ephemeral processing.'
  contact:
    name: Emboss
    url: https://getemboss.ai/
    email: contact@getemboss.ai
  license:
    name: Emboss Terms of Service
    url: https://getemboss.ai/terms
  version: 1.0.0
  x-agentic-access-contract: https://api.getemboss.ai/agentic-access.json
servers:
- url: https://api.getemboss.ai
security:
- bearer: []
- oauth2:
  - forms:read
  - forms:write
tags:
- name: Forms
  description: Make a PDF fillable, inspect its fields, and manage the forms in your library.
paths:
  /forms/quote:
    post:
      summary: Price a document before you call
      description: 'Price what making a form fillable, and optionally filling it from

        context documents, would cost before you actually run it.


        Send the same PDF and optional context documents you would send to

        POST /forms or /forms/with-context. Returns the price for each possible

        next step, in cents, and whether it would be covered by your

        free monthly allowance. Nothing is created, saved, or billed by this call.'
      operationId: account_quote_forms_quote_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_account_quote_forms_quote_post'
            example:
              context:
              - <a supporting document, sent as a file>
              file: <the PDF form, sent as a file>
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example:
                already_fillable: false
                billing:
                  billing_url: https://getemboss.ai/dashboard/billing
                  exempt: false
                  has_card: false
                context_pages: 1
                effective: '2026-09-07'
                lines:
                  create_and_fill_from_context:
                    cents: 8
                    free: false
                    kinds:
                      create:
                        covered: true
                        reason: within_allowance
                        remaining: 2
                      with_context:
                        covered: false
                        reason: allowance_used
                        remaining: 0
                  create_form:
                    cents: 5
                    free: true
                    kinds:
                      create:
                        covered: true
                        reason: within_allowance
                        remaining: 2
                  fill_from_data:
                    cents: 2
                    free: true
                    kinds:
                      standard_fill:
                        covered: true
                        reason: within_allowance
                        remaining: 4
                  verify:
                    cents: 1
                    free: true
                    kinds:
                      verify:
                        covered: true
                        reason: within_allowance
                        remaining: 4
                pages: 2
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '429':
          description: Too many calls that start work this clock hour for this API key; the count resets on the hour.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: rate limit exceeded
        '400':
          description: The request was refused; the problem document's detail says why.
          content:
            application/problem+json:
              schema:
                type: object
              example:
                type: https://paymentauth.org/problems/bad-request
                title: Bad Request
                status: 400
                detail: a PDF file is required.
      tags:
      - Forms
      x-agentic-access:
        action-class: connected
        consequence: read
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:read
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: none
  /forms:
    post:
      summary: Create a form
      description: 'Turn a flat or scanned PDF into a fillable form.


        Send the PDF as an uploaded file, or name a form already in the public

        library by its slug instead (send one or the other, not both). Emboss

        detects the fields and names them from the words printed beside them.

        Processing runs in the background: the call returns a form_id right

        away with status "processing", and GET /forms/{form_id} reports when it

        turns "ready" or "failed".'
      operationId: create_form_forms_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_form_forms_post'
            example:
              file: <the PDF form, sent as a file>
              retention: ephemeral
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormCreated'
              example:
                form_id: 11111111-2222-3333-4444-555555555555
                library: null
                source_artifact_id: 22222222-3333-4444-5555-666666666666
                status: processing
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '402':
          description: No payment method on file, and the monthly free allowance is used up or the document is over the free page limit (a fax always needs a card). The body's detail carries code, message and billing_url.
          content:
            application/json:
              schema:
                type: object
              example:
                detail:
                  code: over_free_tier
                  billing_url: https://getemboss.ai/dashboard/billing
                  message: You are over the free tier. Add a payment method at https://getemboss.ai/dashboard/billing to continue.
        '429':
          description: Too many calls that start work this clock hour for this API key; the count resets on the hour.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: rate limit exceeded
      tags:
      - Forms
      x-agentic-access:
        action-class: acting
        consequence: write
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:write
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: required
        x-billed:
        - create
    get:
      summary: List your forms
      description: 'List the forms in your account''s library.


        By default returns only forms that finished processing and are ready to

        fill, up to 100 forms; limit and offset are ignored on this default

        path. Pass states=all to also see forms still processing or that

        failed, and to page through the full list with limit and offset. Each

        entry gives the form''s id, title, status, and when it was created.'
      operationId: list_forms_forms_get
      parameters:
      - name: states
        in: query
        required: false
        schema:
          enum:
          - ready
          - all
          type: string
          default: ready
          title: States
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormsListResponse'
              example:
                forms:
                - created_at: '2026-09-10T14:32:00+00:00'
                  has_thumbnail: true
                  id: 11111111-2222-3333-4444-555555555555
                  no_fields: false
                  retention:
                    documents_deleted_after: '2026-10-10T14:32:00+00:00'
                    documents_deleted_at: null
                    policy: account_default
                  status: ready
                  title: W-9 Request for Taxpayer Identification
                limit: 100
                offset: 0
                total: 1
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
      tags:
      - Forms
      x-agentic-access:
        action-class: connected
        consequence: read
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:read
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: none
  /forms/{form_id}:
    get:
      summary: Get a form
      description: 'Check whether a form finished processing.


        Poll this after POST /forms until status turns "ready" (or "failed",

        with an error message). A ready form''s response includes the id of its

        fillable PDF and, when it came from the library, the slug and revision

        it was seeded from.'
      operationId: get_form_forms__form_id__get
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormStatus'
              example:
                artifact_id: 22222222-3333-4444-5555-666666666666
                error: null
                id: 11111111-2222-3333-4444-555555555555
                library: null
                retention:
                  documents_deleted_after: '2026-10-10T14:32:00+00:00'
                  documents_deleted_at: null
                  policy: account_default
                reused_layout: false
                schema_version: '1.0'
                source_artifact_id: 33333333-4444-5555-6666-777777777777
                status: ready
                title: W-9 Request for Taxpayer Identification
                warnings: []
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '404':
          description: No such resource, or it belongs to another account.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: not found
      tags:
      - Forms
      x-agentic-access:
        action-class: connected
        consequence: read
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:read
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: none
    delete:
      summary: Delete a form
      description: 'Delete a form and the documents behind it.


        This is the reversal for a fill: it takes back the documents Emboss wrote and

        the sources it was given. It can be called at any time while the documents

        exist. Under ephemeral processing they exist for 60 to 70 minutes after the

        last activity on the form, after which Emboss deletes them anyway and there is

        nothing left to take back.


        If the form still has work running (a fill, a batch, a with-context job),

        this answers 409 instead of deleting: the files that job needs would be

        pulled out from under it.'
      operationId: delete_form_forms__form_id__delete
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example:
                ok: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '404':
          description: No such resource, or it belongs to another account.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: not found
        '409':
          description: A fill, a batch or a with-context job on this form is still running.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: form is processing
      tags:
      - Forms
      x-agentic-access:
        action-class: acting
        consequence: write
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:write
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        escalation:
          human-in-the-loop: required
        x-curation-reason: Permanently removes the form and its files from the account; it cannot be undone.
        audit: required
  /forms/{form_id}/contract:
    get:
      summary: Get the contract
      description: 'Get the full field inventory Emboss detected on a form.


        Returns the contract: every field''s id, label, type, page, and position,

        plus any warnings from detection. Only available once the form''s status

        is "ready"; asks again with a 409 if it is still processing.'
      operationId: get_contract_forms__form_id__contract_get
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponse'
              example:
                contract:
                  fields:
                  - id: 1
                    label: Name
                    page: 0
                    type: text
                  page_count: 1
                  schema_version: '1.0'
                  warnings: []
                id: 11111111-2222-3333-4444-555555555555
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '404':
          description: No such resource, or it belongs to another account.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: not found
      tags:
      - Forms
      x-agentic-access:
        action-class: connected
        consequence: read
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:read
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: none
  /forms/{form_id}/fillable:
    get:
      summary: Download the fillable PDF
      description: 'Download a form''s blank fillable PDF.


        Streams the PDF with the detected fields turned into real, fillable

        widgets, with no values entered. Only available once the form''s status

        is "ready".'
      operationId: get_fillable_forms__form_id__fillable_get
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      responses:
        '200':
          description: The file.
          content:
            application/pdf: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '404':
          description: No such resource, or it belongs to another account.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: fillable PDF not available
        '410':
          description: The form's documents were deleted under its retention policy.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: 'Ephemeral processing: source and output documents are deleted 60 to 70 minutes after the last activity on a form.'
      tags:
      - Forms
      x-agentic-access:
        action-class: connected
        consequence: read
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:read
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: none
  /forms/{form_id}/thumbnail:
    get:
      summary: Download the thumbnail
      description: 'Download a small PNG preview of a form''s first page.


        Useful for showing a form in a picker or library view without fetching

        the whole PDF. Returns 404 if no thumbnail was generated for this form.'
      operationId: get_thumbnail_forms__form_id__thumbnail_get
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      responses:
        '200':
          description: The file.
          content:
            image/png: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '404':
          description: No such resource, or it belongs to another account.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: thumbnail not available
        '410':
          description: The form's documents were deleted under its retention policy.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: 'Ephemeral processing: source and output documents are deleted 60 to 70 minutes after the last activity on a form.'
      tags:
      - Forms
      x-agentic-access:
        action-class: connected
        consequence: read
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:read
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: none
  /forms/with-context:
    post:
      summary: Create and fill a form from documents
      description: 'Make a form fillable and fill it in one call, using supporting

        documents instead of typed-in values.


        Send the blank form (a file, or a library slug) plus one or more context

        documents (an ID, a prior filing, anything with the answers in it).

        Emboss detects the form''s fields, reads the context documents, and fills

        what it can find. Runs as a background job: poll it with

        GET /forms/with-context/{job_id} for the filled PDF and a report of

        what was filled, left blank, or needs confirming.'
      operationId: create_with_context_forms_with_context_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_with_context_forms_with_context_post'
            example:
              context:
              - <a supporting document, sent as a file>
              file: <the PDF form, sent as a file>
              policy: safe
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextJobCreated'
              example:
                job_id: 77777777-8888-9999-aaaa-bbbbbbbbbbbb
                status: processing
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '402':
          description: No payment method on file, and the monthly free allowance is used up or the document is over the free page limit (a fax always needs a card). The body's detail carries code, message and billing_url.
          content:
            application/json:
              schema:
                type: object
              example:
                detail:
                  code: over_free_tier
                  billing_url: https://getemboss.ai/dashboard/billing
                  message: You are over the free tier. Add a payment method at https://getemboss.ai/dashboard/billing to continue.
        '429':
          description: Too many calls that start work this clock hour for this API key; the count resets on the hour.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: rate limit exceeded
      tags:
      - Forms
      x-agentic-access:
        action-class: acting
        consequence: write
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:write
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: required
        x-billed:
        - create
        - with_context
  /forms/{form_id}/with-context:
    post:
      summary: Fill a form from documents
      description: 'Fill a form you already created from supporting documents.


        Send one or more context files, and optionally a policy (safe, the default, or strict).

        Returns 202 with a job_id to poll at GET /forms/with-context/{job_id}. Bills one context

        fill; the form is not detected again.'
      operationId: fill_existing_with_context_forms__form_id__with_context_post
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_fill_existing_with_context_forms__form_id__with_context_post'
            example:
              context:
              - <a supporting document, sent as a file>
              policy: safe
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextJobCreated'
              example:
                job_id: 77777777-8888-9999-aaaa-bbbbbbbbbbbb
                status: processing
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
