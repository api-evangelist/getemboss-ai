        audit: none
  /forms/fill-batch/{batch_id}/rows/{n}/pdf:
    get:
      summary: Download a row's PDF
      description: 'Download one filled PDF from a batch, by its row number.


        Row numbers start at 1: row 1 is the first data row of the batch''s

        source spreadsheet. Answers 404 if that row has not been filled (still

        processing, or that row failed).'
      operationId: batch_row_pdf_forms_fill_batch__batch_id__rows__n__pdf_get
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Batch Id
      - name: n
        in: path
        required: true
        schema:
          type: integer
          title: N
      responses:
        '200':
          description: The file.
          content:
            application/pdf: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '404':
          description: No such resource, or it belongs to another account.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: row pdf not found
        '410':
          description: The form's documents were deleted under its retention policy.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: 'Ephemeral processing: source and output documents are deleted 60 to 70 minutes after the last activity on a form.'
      tags:
      - Forms
      x-agentic-access:
        action-class: connected
        consequence: read
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:read
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: none
  /forms/fill-batch/{batch_id}/zip:
    get:
      summary: Download a batch as a zip
      description: 'Download every successfully filled PDF from a batch as one zip file.


        Rows that failed to fill are left out of the zip; check the batch

        status for the per-row results to see which rows those were.'
      operationId: batch_zip_forms_fill_batch__batch_id__zip_get
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
