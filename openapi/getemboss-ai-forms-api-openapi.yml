  /forms/read:
    post:
      summary: Read a filled form
      description: 'Read the filled-in values back out of a PDF, whether or not Emboss

        made it.


        Send the filled PDF. Naming the form_id it belongs to gives the most

        accurate read; without it, Emboss tries to recognize the form from its

        layout. Returns each field''s label and value, and which fields were

        left blank.'
      operationId: read_form_forms_read_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_read_form_forms_read_post'
            example:
              file: <the filled PDF, sent as a file>
              form_id: 11111111-2222-3333-4444-555555555555
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example:
                complete: true
                counts:
                  fields: 1
                  filled: 1
                  required: 1
                  required_filled: 1
                  signatures_missing: 0
                fields:
                - filled: true
                  id: 1
                  label: Full Name
                  name: full_name
                  page: 1
                  required: true
                  type: text
                  value: Grace Hopper
                file_sha256: 3a6f0ad52bf3abaecd2a956efde2247e84ab9385f108dd0677d92ff941f758e1
                fingerprint: fillable:04c7e6853da2366119e9e57ed6ad606706e1bec30f19ae2bc54795e80bd33f08
                form_id: 11111111-2222-3333-4444-555555555555
                match: exact
                page_count: 1
                recognised: own_layout
                unmatched: []
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '402':
          description: No payment method on file, and the monthly free allowance is used up or the document is over the free page limit (a fax always needs a card). The body's detail carries code, message and billing_url.
          content:
            application/json:
              schema:
                type: object
              example:
                detail:
                  code: over_free_tier
                  billing_url: https://getemboss.ai/dashboard/billing
                  message: You are over the free tier. Add a payment method at https://getemboss.ai/dashboard/billing to continue.
        '429':
          description: Too many calls that start work this clock hour for this API key; the count resets on the hour.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: rate limit exceeded
      tags:
      - Forms
      x-agentic-access:
        action-class: acting
        consequence: write
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:write
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: required
        x-billed:
        - read
  /library:
    get:
      summary: List or search the library
      description: 'List or search the blank government forms Emboss already keeps.


        With no query, returns every form in the library, no account needed. Add

        ?q= (a name or number such as "W-9") to search it; searching needs an API

        key. Start from a result by passing its slug to POST /forms.'
      operationId: get_library_library_get
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example:
                results:
                - agency: IRS
                  page_count: 6
                  revision: Rev. March 2024
                  slug: irs-w-9
                  title: Form W-9, Request for Taxpayer Identification Number and Certification
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '429':
          description: Too many calls that start work this clock hour for this API key; the count resets on the hour.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: rate limit exceeded
      tags:
      - Forms
      security:
      - {}
      - bearer: []
      - oauth2:
        - forms:read
        - forms:write
      x-agentic-access:
        action-class: connected
        consequence: read
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:read
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: none
