  /forms/{form_id}/with-context:
    post:
      summary: Fill Existing With Context
      description: 'Standalone fill-from-context: fill an already-extracted form the caller

        owns from context. Bills ONE with_context event (no re-extraction). The

        form already exists, so `retention` is accepted for symmetry with the

        other routes and validated, but otherwise ignored: the form''s own policy

        (set at creation) is what governs it.'
      operationId: fill_existing_with_context_forms__form_id__with_context_post
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Form Id
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_fill_existing_with_context_forms__form_id__with_context_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextJobCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Forms
      security:
      - bearer: []
      - oauth2:
        - forms:read
        - forms:write
  /forms/with-context/{job_id}:
