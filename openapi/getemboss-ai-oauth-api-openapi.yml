openapi: 3.2.0
info:
  title: Getemboss Ai OAuth API
  version: 0.1.0
  description: 'Operations tagged Oauth across 2 of this provider''s published API definitions: getemboss-ai-account-openapi.json, getemboss-ai-account-openapi.yml. Each path carries the servers of the definition it was published in.'
security:
- bearer: []
- oauth2:
  - forms:read
  - forms:write
tags:
- name: OAuth
paths:
  /oauth/{_rest}:
    options:
      summary: Preflight
      operationId: preflight_oauth___rest__options
      parameters:
      - name: _rest
        in: path
        required: true
        schema:
          type: string
          title: ' Rest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
      tags:
      - OAuth
  /oauth/register:
    post:
      summary: Register
      operationId: register_oauth_register_post
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security: []
      tags:
      - OAuth
  /oauth/authorize:
    get:
      summary: Authorize
      operationId: authorize_oauth_authorize_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security: []
      tags:
      - OAuth
  /oauth/token:
    post:
      summary: Token
      operationId: token_oauth_token_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security: []
      tags:
      - OAuth
  /oauth/revoke:
    post:
      summary: Revoke
      operationId: revoke_oauth_revoke_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security: []
      tags:
      - OAuth
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: Emboss API key (sk_...)
      description: An Emboss API key. See https://getemboss.ai/docs/authentication.
    oauth2:
      type: oauth2
      description: Sign in with your Emboss account. See https://getemboss.ai/docs/authentication.
      flows:
        authorizationCode:
          authorizationUrl: https://api.getemboss.ai/oauth/authorize
          tokenUrl: https://api.getemboss.ai/oauth/token
          scopes:
            forms:read: Read your forms
            forms:write: Create and fill forms
x-refined-from:
- getemboss-ai-account-openapi.json
- getemboss-ai-account-openapi.yml
