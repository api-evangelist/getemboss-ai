openapi: 3.2.0
info:
  title: Emboss Filling API
  summary: Turn a flat PDF into a fillable form, fill it, check it, and send it.
  description: 'Emboss is a PDF form-filling API for developers and agents. Hand it a flat or scanned PDF and it detects the fields and returns a fillable form. Fill that form from structured values or from the documents that hold the answers, and Emboss proposes every answer with its source, says what is missing, and returns the finished PDF with a receipt. It also reads a filled form back into labelled values, fills one copy per spreadsheet row, packages a form with its attachments, and faxes the result. Pricing is per job in cents with a monthly free allowance.


    The same engine answers on four interfaces: this REST API, a remote MCP server at /mcp, an A2A agent at /a2a, and an anonymous pay-per-call API at /pay whose own manifest is served at the origin root /openapi.json.


    Documents are deleted 60 to 70 minutes after the last activity on a form under ephemeral processing.'
  contact:
    name: Emboss
    url: https://getemboss.ai/
    email: contact@getemboss.ai
  license:
    name: Emboss Terms of Service
    url: https://getemboss.ai/terms
  version: 1.0.0
  x-agentic-access-contract: https://api.getemboss.ai/agentic-access.json
servers:
- url: https://api.getemboss.ai
security:
- bearer: []
- oauth2:
  - forms:read
  - forms:write
tags:
- name: Filling
  description: Fill a form from values or from documents, in one call or as a proposal you commit.
paths:
  /sessions:
    post:
      summary: Start a session
      description: 'Start a session for filling one form field by field.


        Send the form_id of a ready form. Returns a session_id along with the

        form''s starting state and the list of required fields still missing a

        value. Use PUT /sessions/{sid}/fields to set values as you collect them,

        then POST /sessions/{sid}/fill to render the finished PDF.'
      operationId: create_session_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            example:
              form_id: 11111111-2222-3333-4444-555555555555
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example:
                form_state:
                  fields:
                    '1':
                      candidates: []
                      confidence: null
                      evidence: []
                      history: []
                      invalid_reason: null
                      note: null
                      origin: null
                      reoffered: false
                      source: null
                      status: unfilled
                      value: null
                  turn_count: 0
                missing:
                - 1
                next_prompt: null
                pending_confirmation: []
                session_id: 88888888-9999-aaaa-bbbb-cccccccccccc
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '410':
          description: The form's documents were deleted under its retention policy.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: 'Ephemeral processing: source and output documents are deleted 60 to 70 minutes after the last activity on a form.'
        '400':
          description: form_id is not a UUID.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: form_id must be a UUID
        '404':
          description: No such form, or it belongs to another account.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: form not found
        '409':
          description: The form is not ready yet.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: form not ready
      tags:
      - Filling
      x-agentic-access:
        action-class: acting
        consequence: write
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:write
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: required
  /sessions/{sid}:
    get:
      summary: Get a session
      description: 'Read back a session''s current state.


        Returns the session''s status and the values collected on it so far, so a

        caller can resume a session it started earlier instead of tracking

        field values itself.'
      operationId: get_session_sessions__sid__get
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Sid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example:
                artifact_id: null
                artifacts: []
                form_state:
                  fields:
                    '1':
                      candidates: []
                      confidence: high
                      evidence: []
                      history:
                      - status: filled
                        turn: 1
                        value: Grace Hopper
                      - status: confirmed
                        turn: 1
                        value: Grace Hopper
                      invalid_reason: null
                      note: null
                      origin: caller
                      reoffered: false
                      source: direct
                      status: confirmed
                      value: Grace Hopper
                  turn_count: 1
                session_id: 88888888-9999-aaaa-bbbb-cccccccccccc
                status: active
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '404':
          description: No such resource, or it belongs to another account.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: not found
        '410':
          description: The form's documents were deleted under its retention policy.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: 'Ephemeral processing: source and output documents are deleted 60 to 70 minutes after the last activity on a form.'
      tags:
      - Filling
      x-agentic-access:
        action-class: connected
        consequence: read
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:read
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: none
  /sessions/{sid}/fields:
    put:
      summary: Set field values
      description: 'Set or update values on a session''s fields.


        Send a list of field_id/value pairs. Returns the session''s full updated

        state plus the list of fields this call actually applied. Values for

        fields that do not exist on the form are rejected with a 422 naming

        the bad field_ids, and nothing in the request is applied.'
      operationId: put_fields_sessions__sid__fields_put
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Sid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldsRequest'
            example:
              updates:
              - field_id: 1
                value: Grace Hopper
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example:
                applied:
                - 1
                form_state:
                  fields:
                    '1':
                      candidates: []
                      confidence: high
                      evidence: []
                      history:
                      - status: filled
                        turn: 1
                        value: Grace Hopper
                      - status: confirmed
                        turn: 1
                        value: Grace Hopper
                      invalid_reason: null
                      note: null
                      origin: caller
                      reoffered: false
                      source: direct
                      status: confirmed
                      value: Grace Hopper
                  turn_count: 1
                session_id: 88888888-9999-aaaa-bbbb-cccccccccccc
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '404':
          description: No such resource, or it belongs to another account.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: not found
        '410':
          description: The form's documents were deleted under its retention policy.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: 'Ephemeral processing: source and output documents are deleted 60 to 70 minutes after the last activity on a form.'
        '409':
          description: 'The session is completed: its PDF was rendered, by a fill or a commit.'
          content:
            application/json:
              schema:
                type: object
              example:
                detail: session already completed
      tags:
      - Filling
      x-agentic-access:
        action-class: acting
        consequence: write
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:write
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: required
  /sessions/{sid}/fill:
    post:
      summary: Render the filled PDF
      description: 'Render a session''s collected values onto the form''s PDF.


        Fills in every value set on the session so far and marks it completed.

        This is the billed step; setting field values with PUT

        /sessions/{sid}/fields is free. Once complete, fetch the PDF with

        GET /sessions/{sid}/pdf.'
      operationId: fill_sessions__sid__fill_post
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Sid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example:
                artifact_id: 99999999-aaaa-bbbb-cccc-dddddddddddd
                artifacts:
                - artifact_id: 99999999-aaaa-bbbb-cccc-dddddddddddd
                  mime_type: application/pdf
                  role: filled
                session_id: 88888888-9999-aaaa-bbbb-cccccccccccc
                status: completed
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '404':
          description: No such resource, or it belongs to another account.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: not found
        '402':
          description: No payment method on file, and the monthly free allowance is used up or the document is over the free page limit (a fax always needs a card). The body's detail carries code, message and billing_url.
          content:
            application/json:
              schema:
                type: object
              example:
                detail:
                  code: over_free_tier
                  billing_url: https://getemboss.ai/dashboard/billing
                  message: You are over the free tier. Add a payment method at https://getemboss.ai/dashboard/billing to continue.
        '429':
          description: Too many calls that start work this clock hour for this API key; the count resets on the hour.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: rate limit exceeded
        '410':
          description: The form's documents were deleted under its retention policy.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: 'Ephemeral processing: source and output documents are deleted 60 to 70 minutes after the last activity on a form.'
        '409':
          description: 'The session is completed: its PDF was rendered, by a fill or a commit.'
          content:
            application/json:
              schema:
                type: object
              example:
                detail: session already completed
      tags:
      - Filling
      x-agentic-access:
        action-class: acting
        consequence: write
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:write
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: required
        x-billed:
        - standard_fill
  /sessions/{sid}/pdf:
    get:
      summary: Download the filled PDF
      description: 'Download a session''s filled PDF.


        Streams the filled PDF. A session started with POST /sessions downloads

        once POST /sessions/{sid}/fill, the billed step, has filled it; before

        that this answers 409 with code not_filled. A session a fill from

        documents produced is rendered on demand at no extra charge, because

        that fill was already charged.'
      operationId: session_pdf_sessions__sid__pdf_get
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Sid
      responses:
        '200':
          description: The file.
          content:
            application/pdf: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '404':
          description: No such resource, or it belongs to another account.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: filled PDF not available
        '410':
          description: The form's documents were deleted under its retention policy.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: 'Ephemeral processing: source and output documents are deleted 60 to 70 minutes after the last activity on a form.'
        '409':
          description: 'The session has not been filled yet: fill it with POST /sessions/{sid}/fill, the billed step, then download it.'
          content:
            application/json:
              schema:
                type: object
              example:
                detail:
                  code: not_filled
                  message: This session has not been filled yet. Fill it with POST /sessions/9b1c0e2a-4d6f-4a8b-9c1d-2e3f4a5b6c7d/fill, which is the billed step, then download it.
      tags:
      - Filling
      x-agentic-access:
        action-class: connected
        consequence: read
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:read
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: none
  /proposals/{proposal_id}/commit:
    post:
      summary: Commit a proposal
      description: 'Turn a proposal into a finished, filled PDF. A proposal is the set of

        candidate values a prepare-from-context call left on a form, not yet

        committed to paper.


        Send corrected values and confirmed field ids as JSON only; this call

        does not accept files, so attach any new documents first on the

        attachments route. A commit is free unless package is true, which an

        account is billed for as one package. A proposal takes up to 10 commits,

        and each runs in the background, so poll GET /forms/with-context/{job_id}

        for the result or fetch the finished PDF from GET /proposals/{proposal_id}/pdf.


        Checkboxes take yes or no; yes ticks that box. In a Yes/No pair, say yes

        to the box you want; two yeses in one pair are refused.'
      operationId: commit_proposals__proposal_id__commit_post
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Proposal Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextJobCreated'
              example:
                job_id: 77777777-8888-9999-aaaa-bbbbbbbbbbbb
                status: processing
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '404':
          description: No such resource, or it belongs to another account.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: not found
        '402':
          description: No payment method on file, and the monthly free allowance is used up or the document is over the free page limit (a fax always needs a card). The body's detail carries code, message and billing_url.
          content:
            application/json:
              schema:
                type: object
              example:
                detail:
                  code: over_free_tier
                  billing_url: https://getemboss.ai/dashboard/billing
                  message: You are over the free tier. Add a payment method at https://getemboss.ai/dashboard/billing to continue.
        '410':
          description: The form's documents were deleted under its retention policy.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: 'Ephemeral processing: source and output documents are deleted 60 to 70 minutes after the last activity on a form.'
        '400':
          description: The request was refused; the problem document's detail says why.
          content:
            application/problem+json:
              schema:
                type: object
              example:
                type: https://paymentauth.org/problems/bad-request
                title: Bad Request
                status: 400
                detail: body must be JSON
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $defs:
                CommitValue:
                  description: 'One caller decision. A null value SKIPS the field (a deliberate blank),

                    which is not the same as omitting it (leave whatever the proposal holds).'
                  properties:
                    field_id:
                      title: Field Id
                      type: integer
                    value:
                      title: Value
                    note:
                      anyOf:
                      - type: string
                      - type: 'null'
                      title: Note
                  required:
                  - field_id
                  title: CommitValue
                  type: object
              properties:
                values:
                  default: []
                  items:
                    $ref: '#/$defs/CommitValue'
                  title: Values
                  type: array
                confirm:
                  default: []
                  items:
                    type: integer
                  title: Confirm
                  type: array
                policy:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Policy
                idempotency_key:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Idempotency Key
                package:
                  default: false
                  title: Package
                  type: boolean
              title: CommitRequest
              type: object
            example:
              confirm:
              - 2
              idempotency_key: null
              package: false
              policy: safe
              values:
              - field_id: 1
                note: null
                value: Grace Hopper
      tags:
      - Filling
      x-agentic-access:
        action-class: acting
        consequence: write
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:write
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: required
        x-billed:
        - package
  /proposals/{proposal_id}:
    get:
      summary: Read a proposal
      description: 'Get one proposal, readable by the account that owns it or by an

        anonymous payer on the pay-per-call API holding the token minted for this

        proposal.


        A payer''s response echoes that token back as commit_token, the

        credential to send when committing. An owner never sees that field:

        their API key is already proof enough.'
      operationId: get_proposal_proposals__proposal_id__get
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Proposal Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalResponse'
              example:
                artifacts:
                - artifact_id: 99999999-aaaa-bbbb-cccc-dddddddddddd
                  mime_type: application/pdf
                  role: package
                attachments: []
                commit_token: null
                confirmations:
                - confidence: low
                  evidence:
                  - document_id: d1
                    document_name: source.pdf
                    location: born December 9, 1906
                    method: quote_check
                    page: 1
                    text_hash: null
                  field_id: 2
                  label: Date of Birth
                  value: '1906-12-09'
                error: null
                expires_at: '2026-09-22T18:00:00+00:00'
                fields:
                - candidates: []
                  confidence: high
                  evidence:
                  - document_id: d1
                    document_name: source.pdf
                    location: 'Name: Grace Hopper'
                    method: quote_check
                    page: 1
                    text_hash: null
                  field_id: 1
                  label: Full Name
                  origin: document
                  required: true
                  state: ready
                  tiebreak: null
                  value: Grace Hopper
                - candidates:
                  - confidence: low
                    evidence:
                    - document_id: d1
                      document_name: source.pdf
                      location: born December 9, 1906
                      method: quote_check
                      page: 1
                      text_hash: null
                    value: '1906-12-09'
                  confidence: low
                  evidence: []
                  field_id: 2
                  label: Date of Birth
                  origin: null
                  required: true
                  state: needs_confirmation
                  tiebreak: null
                  value: null
                form_id: 11111111-2222-3333-4444-555555555555
                mode: two_call
                package_url: https://getemboss.ai/d/EXAMPLE-LINK-TOKEN
                policy: safe
                proposal_id: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                questions: []
                requirements:
                  attachments: []
                  signatures: []
                status: committed
                summary:
                  conflict: 0
                  invalid: 0
                  missing: 0
                  needs_confirmation: 1
                  ready: 1
                  required_unresolved: 1
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: No credential, or an API key or access token that is unknown, revoked or turned off.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: invalid or revoked API key
        '403':
          description: An app connected over OAuth whose permission does not cover this call, or whose access was revoked.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: This connection only has forms:read access; this call needs forms:write. Reconnect Emboss to allow it.
        '404':
          description: No such resource, or it belongs to another account.
          content:
            application/json:
              schema:
                type: object
              example:
                detail: not found
      tags:
      - Filling
      x-agentic-access:
        action-class: connected
        consequence: read
        subject: required
        audience: https://api.getemboss.ai
        scope:
        - forms:read
        token:
          max-ttl: 3600
          x-api-key-lifetime: until-revoked
        audit: none
  /proposals/{proposal_id}/receipt:
    get:
      summary: Get the receipt
      description: 'Get the receipt for a proposal''s most recent commit.


        Returns the record of what was filled, confirmed, or left blank on the

        latest commit of this proposal. Answers 404 if the proposal has not been

        committed yet.'
      operationId: receipt_proposals__proposal_id__receipt_get
      parameters:
      - name: proposal_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Proposal Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
              example:
                checks:
                  fields: []
                  summary:
                    checked: 11
                    cost: 0.0021
                    doubted: 0
                    ms: 480
                    ran: true
                commits:
                - at: '2026-09-22T14:05:00+00:00'
                  auto: false
                  n: 1
                  result: complete
