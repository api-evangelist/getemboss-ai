summary: >-
  Emboss publishes an interactive Swagger UI console but NO sandbox environment: keys are sk_live_ only, the specs
  declare a single production server, and there is no test-mode counterpart. What it offers instead is unusually
  good rehearsal: free stateless price quotes on every door, a prepare step that proposes every answer with
  evidence before anything is written, a preview-fill, a model-free verify, and a monthly free allowance so the
  first calls cost nothing.
