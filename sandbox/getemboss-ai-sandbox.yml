    No test fax number, test PDF fixture or magic value is published.
free_tier_as_rehearsal:
  source: https://getemboss.ai/pricing
  allowance: 5 forms created, 5 context fills, 5 standard fills, 5 verifications, 5 reads, 5 submission packages per month, each on a document of 5 pages or fewer; no card needed.
  note: The free allowance runs against production and the same keys — it lowers the cost of a first call, it does not isolate it.
rehearsal_affordances:
  operations:
  - operation: account_quote_forms_quote_post
    path: POST /forms/quote
    effect: Prices every route for the document and says whether the free tier covers it. Free, stateless, never metered.
  - operation: pay_quote
    path: POST /pay/quote
    effect: Page count, already-fillable flag and exact price per pay-door operation, anonymously, before any payment.
  - operation: prepare_new_forms_prepare_post
    path: POST /forms/prepare
    effect: Proposes every answer with its source, what is missing and where documents disagree — nothing is written until commit.
  - operation: preview_fill_forms__form_id__preview_fill_post
    path: POST /forms/{form_id}/preview-fill
    effect: Preview a fill before rendering.
  - operation: verify_filled_pdf_forms__form_id__verify_post
    path: POST /forms/{form_id}/verify
    effect: Deterministic check of a filled PDF against the contract; no model call.
  - operation: get_library_library_get
    path: GET /library
    effect: Public list of blank US federal forms to start from without uploading anything.
  - operation: health_health_get
    path: GET /health
    effect: Unauthenticated liveness probe.
  gap: send_fax_fax_post has no rehearsal path other than quote — the only operation with an external side effect is the one that cannot be dry-run.
