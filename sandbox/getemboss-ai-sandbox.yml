source: >-
  https://getemboss.ai/docs/authentication, /docs/quickstart, /docs/reference/usage, /docs/prepare-commit-verify,
  /docs/pay-per-call, https://api.getemboss.ai/docs (Swagger UI) and both OpenAPIs. The site llms.txt (every
