    interface https://api.getemboss.ai/a2a is on the same host that serves both Emboss OpenAPIs and the MCP
    endpoint; securitySchemes describe "An Emboss API key (sk_...)" and point at https://getemboss.ai/docs/authentication;
    documentationUrl is https://getemboss.ai/docs/a2a; and the card carries a JWS signature whose kid
    (emboss-a2a-1) resolves through did:web:getemboss.ai at /.well-known/did.json and /.well-known/a2a-jwks.json.
