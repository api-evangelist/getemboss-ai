  host: api.getemboss.ai
  note: >-
    The card is served on BOTH hosts and at BOTH paths, byte-identical: api.getemboss.ai and getemboss.ai each
    answer /.well-known/agent-card.json (canonical) and /.well-known/agent.json (legacy) with the same 23,281-byte
    document (cmp confirmed identical bytes across hosts). The API host serves it as application/a2a+json, the
    apex as application/json. Emboss's own docs say this mirroring is deliberate — "bytes unchanged, so its own
    signature verifies on either host" (https://getemboss.ai/docs/reference/trust). The API host is recorded as
    the discovery host because it is the one the harvest lead, the ARD catalogue entry
    (urn:air:getemboss.ai:a2a:emboss), x-service-info.a2a in the pay-door OpenAPI and the A2A guide all name.
