summary:
  hosts_probed: 3
  paths_probed: 25
  documents_served: 16
  path_echo_control: passed
  note: >-
    Emboss serves a two-host discovery surface. The apex (getemboss.ai) carries the RFC 9116 security.txt, the
    ARD/AIR catalogue (ard.json, with ai-catalog.json as an alias), the MCP registry server record, a W3C DID
    document and mirrors of the A2A agent card. The API host (api.getemboss.ai) carries the RFC 8414
    authorization-server metadata, RFC 9728 protected-resource metadata for the MCP resource (at the
    path-suffixed location /.well-known/oauth-protected-resource/mcp, which the 401 challenge's resource_metadata
    parameter names), the A2A JWKS, its own llms.txt, and the same catalogue/DID/MCP/agent-card documents.
    www.getemboss.ai answers 308 to the apex for every path and serves nothing itself. NOT served anywhere:
    openid-configuration, api-catalog (RFC 9727), ai-plugin.json, ucp.json, acp.json, aauth-resource.json,
    apis.json / apis.yml, and the un-suffixed /.well-known/oauth-protected-resource.
