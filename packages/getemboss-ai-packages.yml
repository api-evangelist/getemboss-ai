  first-party client packages, all of them platform integrations that point at the hosted API/MCP endpoint:
  an n8n community node (npm), a Claude Code plugin (GitHub marketplace) and a Gemini CLI / Antigravity extension
  (GitHub). Every code sample in the docs is raw HTTP (curl, fetch, requests). Searched and NOT found: any
  package named emboss/getemboss/emboss-sdk/@emboss/* on npm (the bare "emboss" npm package is an unrelated
  2016 placeholder by another author) or PyPI ("emboss" on PyPI is an unrelated on-disk cache library by
  DJRHails), nothing on RubyGems, nothing first-party on crates.io.
sdk_count: 0
sdk_note: >-
