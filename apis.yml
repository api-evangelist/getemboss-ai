- aid: getemboss-ai:emboss-pay-per-call-api
  name: Emboss Pay-per-call API
  description: >-
    The anonymous pay door at api.getemboss.ai/pay: make fillable, fill from data, fill with context, read a
    filled form back, and fax, each priced per job by page count, plus a free stateless quote. No account or key —
    the first request answers 402 with an x402 challenge (USDC on Base, or gasless via Circle Gateway) and an MPP
    challenge (Tempo USDC.e or a card via Stripe Shared Payment Tokens); resend the identical request with the
    payment credential and poll a tokened status URL. Always ephemeral. The OpenAPI carries x-payment-info on
    every operation and is the entry Emboss publishes in its ARD/AIR catalogue.
  humanURL: https://getemboss.ai/docs/pay-per-call
  baseURL: https://api.getemboss.ai/pay
