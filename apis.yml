- name: Emboss A2A Agent
  description: >-
    Agent2Agent interface at https://api.getemboss.ai/a2a (JSON-RPC, A2A 1.0) discovered through a signed agent
    card served at /.well-known/agent-card.json on both getemboss.ai and api.getemboss.ai. Twenty-three skills
    covering the whole engine, including quote_job/execute_quote and the seven free PDF utilities. Bearer API key
    or OAuth 2.1, or anonymous pay-per-job with the a2a-x402 extension (USDC on Base). The card's Ed25519 JWS
    verifies against did:web:getemboss.ai.
  humanURL: https://getemboss.ai/docs/a2a
  baseURL: https://api.getemboss.ai/a2a
  tags:
  - A2A
  - agent-native
  - x402
