apis:
- aid: getemboss-ai:emboss-account-api
  name: Emboss Account API
  description: >-
    The authenticated developer API on api.getemboss.ai: create fillable forms (or start from the public library
    of US federal forms), fill them from data with a standard-fill session or from documents with a context fill,
    prepare/commit/verify with an evidence-carrying proposal and receipt, batch fill from a spreadsheet, read a
    filled PDF back, send and track faxes, walk artifact lineage, and run seven free PDF utilities. Bearer API key
    (sk_live_...) with Idempotency-Key on the create/fill/fax writes, optional signed callbacks, and per-request
    retention control. The harvested contract is the FastAPI schema behind the provider's Swagger UI; it also
    carries the dashboard's admin, user-auth and OAuth-server routes.
  humanURL: https://getemboss.ai/docs/reference/create-form
