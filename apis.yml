apis:
- name: Emboss MCP Server
  description: >-
    Remote Model Context Protocol server at https://api.getemboss.ai/mcp (Streamable HTTP) exposing twenty
    form-filling tools under forms:read / forms:write scopes. OAuth 2.1 with PKCE and dynamic client registration
    (RFC 8414 + RFC 9728 metadata published; anonymous tools/list answers 401), or a static Emboss API
    key as Bearer. Listed in the MCP registry as io.github.edwinorange/emboss and packaged as a Claude
    Code plugin and a Gemini CLI / Antigravity extension. No stdio package exists.
  humanURL: https://getemboss.ai/docs/mcp-tools
  baseURL: https://api.getemboss.ai/mcp
  tags:
  - MCP
  - Agent-Native
  - PDF
  tags_raw:
  - MCP
  - agent-native
  - PDF
