    url: a2a/getemboss-ai-a2a.yml
  - type: AgentCard
    url: https://api.getemboss.ai/.well-known/agent-card.json
  - type: ToolCrosswalk
    url: mcp/getemboss-ai-tool-crosswalk.yml
  - type: Documentation
