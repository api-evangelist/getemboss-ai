aid: getemboss-ai
name: Emboss
description: >-
  Emboss is a PDF form-filling API for developers and agents. Hand it a flat or scanned PDF and it detects the
  fields and returns a fillable AcroForm, fills the form from structured values or from supporting documents
  (proposing every answer with its source, asking about what is missing), verifies the result, reads a filled
  form back into labelled values, batch-fills one copy per spreadsheet row, packages the filled form with its
  attachments and a receipt, and faxes the result to any US, Canadian or Mexican fax number. Usage-based
  pricing in cents with a monthly free allowance and no subscription. The same engine is exposed through four
  doors on api.getemboss.ai: a 115-operation authenticated REST API (OpenAPI 3.1, Bearer API key or OAuth 2.1
  with dynamic client registration), a remote MCP server (20 tools, OAuth-protected, listed in the MCP
  registry), a signed A2A 1.0 agent card with 23 skills, and an anonymous pay-per-call door priced per job over
  x402 (USDC on Base) or MPP (Tempo stablecoin or card). Every document is deleted 60-70 minutes after the last
  activity under ephemeral processing.
image: https://getemboss.ai/emboss-logo-512.png
url: https://raw.githubusercontent.com/api-evangelist/getemboss-ai/refs/heads/main/apis.yml
x-type: company
x-source: harvest:a2a-registry
x-tier: profiled
x-tier-reason: 'enrichment pass local-v3 2026-09-19 (was stub / harvest)'
specificationVersion: '0.20'
created: '2026-09-19'
modified: '2026-10-10'
