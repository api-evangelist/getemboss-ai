domain_standards:
  note: >-
    Emboss's market is PDF form processing. The contract declares the two PDF form standards that market has —
    ISO 32000 AcroForm interactive forms and Adobe XFA — in operation descriptions, not merely on a marketing page.
    Reward-only; no sector regime lists a required standard for this product category.
  standards:
  - id: iso-32000-acroform
    conforms: true
    evidence: >-
      openapi/getemboss-ai-pay-per-call-openapi.yml paths./pay/make-fillable.post.description ("Turn a flat or
      scanned PDF form into a fillable PDF with detected fields ... add fillable fields to a document ... extract a
      PDF form schema"); the provider-published skill says the output is "a real AcroForm PDF with detected
      fields" (skills/getemboss-ai-emboss-SKILL.md); glossary https://getemboss.ai/glossary/acroform.
  - id: adobe-xfa
    conforms: true
    evidence: >-
      Same operation description names "XFA forms; Adobe LiveCycle forms; Adobe dynamic forms"; the
      x-service-info-linked ARD entry tags "xfa"; https://getemboss.ai/docs/xfa-forms documents xfa_data and
      xfa_render outputs on a fill of an XFA form.
