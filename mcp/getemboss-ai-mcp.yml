registry_record: well-known/getemboss-ai-mcp.json
summary: 'Emboss operates ONE remote MCP server at https://api.getemboss.ai/mcp (Streamable HTTP). It
  is OAuth 2.1 protected: an anonymous POST tools/list and an anonymous initialize both returned 401 with
  WWW-Authenticate: Bearer error="invalid_token", resource_metadata="https://api.getemboss.ai/.well-known/oauth-protected-resource/mcp".
  The server is listed in the MCP registry as io.github.edwinorange/emboss (record mirrored at /.well-known/mcp.json
  on both hosts) and packaged for Claude Code (plugin marketplace GetEmboss-ai/emboss-claude-plugin),
  Claude.ai/Desktop (custom connector), Gemini CLI/Antigravity (GetEmboss-ai/emboss-gemini-extension),
  ChatGPT and Grok. Emboss ships NO stdio package: every install path is a client configuration pointing
  at the hosted endpoint.'
deployment:
  mode: remote
  endpoint: https://api.getemboss.ai/mcp
  auth: oauth
  verified: probed
  note: 'A hosted HTTPS endpoint an MCP client POSTs to directly. auth is oauth because the server advertises
    RFC 9728 protected-resource metadata and an RFC 8414 authorization server with dynamic client registration
    (https://api.getemboss.ai/oauth/register) and PKCE; the docs say "Any MCP client that supports OAuth
    can connect". A static Emboss API key sent as a Bearer header is documented as an alternative for
    clients that cannot do OAuth (https://github.com/GetEmboss-ai/emboss-gemini-extension README, for
    Antigravity). The Claude Code plugin''s .mcp.json is {"emboss": {"type": "http", "url": "https://api.getemboss.ai/mcp"}}
    and the Gemini extension''s gemini-extension.json declares httpUrl https://api.getemboss.ai/mcp —
    configurations, not a local server.'
server:
  name: emboss
  registry_name: io.github.edwinorange/emboss
  registry_version: 1.5.0
  transport: streamable-http
  url: https://api.getemboss.ai/mcp
  protocol_revision: unknown (initialize is auth-gated; not observable anonymously)
  listings:
  - MCP registry (server.json at https://api.getemboss.ai/.well-known/mcp.json and in the plugin repo)
  - Claude Code plugin marketplace "getemboss" (GetEmboss-ai/emboss-claude-plugin, v1.5.1, 2026-09-17)
  - Gemini CLI / Antigravity extension (GetEmboss-ai/emboss-gemini-extension, v1.5.0)
  - Glama (glama.json in both repos)
  setup_guides:
  - https://getemboss.ai/docs/claude
  - https://getemboss.ai/docs/chatgpt
  - https://getemboss.ai/docs/grok
  - https://getemboss.ai/docs/gemini
  - https://getemboss.ai/docs/antigravity
auth:
  methods:
  - oauth2
  - apikey
  oauth2:
    authorization_server: https://api.getemboss.ai
    discovery: well-known/getemboss-ai-oauth-authorization-server.json
    protected_resource: well-known/getemboss-ai-oauth-protected-resource-mcp.json
    grant_types:
    - authorization_code
    - refresh_token
    pkce: S256
    dynamic_client_registration: https://api.getemboss.ai/oauth/register
    scopes_supported:
    - forms:read
    - forms:write
    insufficient_scope_behaviour: A tool call needing a scope the connection lacks returns insufficient_scope;
      reconnect to grant it.
  apikey:
    header: Authorization
    scheme: Bearer
    format: sk_live_...
probe:
- request: POST https://api.getemboss.ai/mcp {"jsonrpc":"2.0","id":1,"method":"tools/list"}
  http_status: 401
  www_authenticate: Bearer error="invalid_token", error_description="Authentication required", resource_metadata="https://api.getemboss.ai/.well-known/oauth-protected-resource/mcp"
  body: '{"error": "invalid_token", "error_description": "Authentication required"}'
  fetched: '2026-09-19'
- request: POST https://api.getemboss.ai/mcp initialize (protocolVersion 2025-06-18)
  http_status: 401
  fetched: '2026-09-19'
- request: GET https://mcp.getemboss.ai/
  http_status: 404
  note: No separate mcp.<domain> host; the server lives on the API host.
tool_schemas: tools/list is auth-gated, so the inputSchema of each tool was NOT observed live. The tool
  names, arguments and return fields below are transcribed from Emboss's own MCP tools reference (https://getemboss.ai/docs/mcp-tools,
  markdown twin at /docs/mcp-tools.md) and its plugin reference.md; the real inputSchema requires an authenticated
  introspection. The backing REST operation for each tool, whose OpenAPI parameters+requestBody ARE the
  real input contract, is in mcp/getemboss-ai-tool-crosswalk.yml.
tool_count: 28
scopes:
  forms:read:
  - list_forms
  - get_form
  - get_usage
  - find_form
  - get_job
  - get_batch
  - get_proposal
  - get_fax
  forms:write:
  - create_form
  - delete_form
  - fill_form
  - fill_form_from_context
  - prepare_form
  - commit_proposal
  - verify_form
  - read_form
  - add_attachment
