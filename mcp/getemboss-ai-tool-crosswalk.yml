purpose: Bind each agent-facing tool/skill to the REST operation(s) that back it, so a tool inherits a REAL input
  contract (the operation's parameters + requestBody) even though the live MCP tools/list is auth-gated. Emboss
  says the four doors run one engine; this file shows where the projections diverge.
